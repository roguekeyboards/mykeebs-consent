name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
  issues:
    types: [edited]

permissions:
  contents: read
  packages: read

jobs:
  renovate:
    if: github.event_name != 'issues' || github.event.issue.title == 'Dependency Dashboard'
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.TOKEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOKEN_APP_PK }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_ALLOWED_COMMANDS: '["^npm run build$"]'
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # GitHub Packages' npm registry doesn't accept App installation tokens, so lookups
          # (hostRules) and npm's own lockfile updates (.npmrc) both use the job's GITHUB_TOKEN.
          RENOVATE_SECRETS: '{"PACKAGES_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}'
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GITHUB_PACKAGES_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}'
        with:
          token: ${{ steps.app-token.outputs.token }}
