name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
  issues:
    types: [edited]

permissions:
  contents: read
  packages: read

jobs:
  renovate:
    if: github.event_name != 'issues' || github.event.issue.title == 'Dependency Dashboard'
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.TOKEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.TOKEN_APP_PK }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_ALLOWED_COMMANDS: '["^npm ci$", "^npm run build$"]'
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # GitHub Packages' npm registry doesn't accept App installation tokens, so lookups
          # (hostRules) and npm itself (.npmrc: lockfile updates and the rebuild's npm ci) use the job's
          # GITHUB_TOKEN.
          RENOVATE_SECRETS: '{"PACKAGES_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}'
          RENOVATE_CUSTOM_ENV_VARIABLES: '{"GITHUB_PACKAGES_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}'
        with:
          token: ${{ steps.app-token.outputs.token }}
